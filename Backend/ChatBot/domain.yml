version: "3.1"

intents:
  - greet
  - greet_salam
  - goodbye
  - help
  - affirm
  - deny
  - bot_challenge
  - ask_movie_showtimes
  - ask_movie_cast
  - ask_movie_director
  - ask_movie_rating
  - ask_movie_genre
  - ask_movie_location
  - ask_ticket_validity
  - ask_movie_info
  - ask_release_date
  - ask_ticket_price
  - ask_movie_duration
  - ask_movie_availability
  - ask_movie_language
  - ask_movie_subtitles
  - ask_movie_suitable
  - ask_genre_recommendation
  - ask_family_friendly
  - ask_movie_theater_availability
  - ask_user_rating
  - ask_current_movies
  - ask_upcoming_releases
  - ask_top_rated_movies
  - ask_movie_festivals
  - ask_movie_description
  - ask_kid_friendly_movies
  - ask_streaming_platform
  - ask_3d_availability
  - ask_movie_poster
  - ask_movie_trailer
  - ask_movie_seats
  - ask_movie_price
  - ask_cinema_hall_info
  - ask_cinema_hall_movies
  - ask_cinema_hall_facilities
  - inform_genre
  - inform_movie_name
  - fallback

entities:
  - movie_name
  - genre
  - location
  - time
  - date
  - cinema_hall

slots:
  movie_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: movie_name
      - type: from_intent
        intent: ask_movie_location
        value: movie_name
      - type: from_intent
        intent: inform_movie_name
        value: movie_name
      - type: from_intent
        intent: ask_movie_showtimes
        value: movie_name
      - type: from_intent
        intent: ask_movie_info
        value: movie_name
  location:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: location
  date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: date
  time:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: time
  genre:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: genre
      - type: from_intent
        intent: inform_genre
        value: genre
  cinema_hall:
    type: text
    mappings:
    - type: from_entity
      entity: cinema_hall

responses:
  utter_greet_salam:
    - text: "Wa Alaikum Assalam Wa Rahmatullahi Wa Barakatuh! How may I assist you today?"
  utter_greet:
    - text: "Hello! How can I help you today?"
    - text: "Hi there! What can I do for you?"
    - text: "Hey! What would you like to know about our movies?"
    - text: "Welcome! How may I assist you?"
    - text: "Greetings! What brings you here today?"
  utter_goodbye:
    - text: "Goodbye! Have a great day!"
    - text: "See you later! Thanks for chatting!"
    - text: "Take care! Come back soon!"
  utter_iamabot:
    - text: "I am a movie assistant bot, powered by Rasa. I can help you with movie information and bookings!"
  utter_ask_another_question:
    - text: "Is there anything else you'd like to know?"
    - text: "Can I help you with something else?"
    - text: "Do you have any other questions?"
  utter_what_help:
    - text: "What would you like to know about our movies or theaters?"
    - text: "How can I assist you with your movie experience?"
    - text: "What information are you looking for?"
  utter_fallback:
    - text: "I'm sorry, I didn't quite understand that. Could you rephrase?"
    - text: "I'm not sure I understand. Could you say that differently?"
    - text: "Could you please rephrase that?"
  utter_help:
    - text: "I can help you with movie information, showtimes, tickets, and more. Just ask me anything about movies!"
  utter_affirm:
    - text: "Great!"
    - text: "Perfect!"
    - text: "Awesome!"
  utter_deny:
    - text: "No problem!"
    - text: "Alright, no worries!"
    - text: "That's fine!"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

actions:
  - action_greet
  - action_goodbye
  - action_help
  - action_bot_challenge
  - action_affirm
  - action_deny
  - action_fallback
  - action_ask_movie_showtimes
  - action_ask_movie_cast
  - action_ask_movie_director
  - action_ask_movie_rating
  - action_ask_movie_genre
  - action_ask_movie_location
  - action_ask_ticket_validity
  - action_ask_movie_info
  - action_ask_release_date
  - action_ask_ticket_price
  - action_ask_movie_duration
  - action_ask_movie_availability
  - action_ask_movie_language
  - action_ask_movie_subtitles
  - action_ask_movie_suitable
  - action_ask_genre_recommendation
  - action_ask_family_friendly
  - action_ask_movie_theater_availability
  - action_ask_user_rating
  - action_ask_current_movies
  - action_ask_upcoming_releases
  - action_ask_top_rated_movies
  - action_ask_movie_festivals
  - action_ask_movie_description
  - action_ask_kid_friendly_movies
  - action_ask_streaming_platform
  - action_ask_3d_availability
  - action_ask_movie_poster
  - action_ask_movie_trailer
  - action_ask_movie_seats
  - action_ask_movie_price
  - action_ask_cinema_hall_info
  - action_ask_cinema_hall_movies
